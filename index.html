<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff8e9">
<meta name="description" content="สมุดบันทึกงานส่วนตัวของ อ.บอล: วางแผนงาน เช็กลิสต์ ไดอารี่ และรายงาน">
<title>สมุดบันทึกงาน · อ.บอล</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Itim&family=Mali:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#463421;--muted:#806d55;--gold:#a87517;--cream:#fffaf0;--paper:#fffefa;--line:#eadfc9;--green:#477b5c;--red:#aa443a;--shadow:0 12px 34px #5b41151c}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font:17px/1.65 'Sarabun',sans-serif;background:linear-gradient(145deg,#fff1d2,#f8e6d2 55%,#f2d8d0);min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit}.top{padding:10px 16px;text-align:center;background:#f4dfaa;color:#5f421d;font:600 15px 'Mali',sans-serif}.top a{font-weight:700;text-decoration-thickness:1px;text-underline-offset:3px}.wrap{max-width:1180px;margin:26px auto 44px;padding:0 16px}.shell{display:grid;grid-template-columns:220px minmax(0,1fr);background:var(--paper);border:1px solid #fff;border-radius:26px;box-shadow:var(--shadow);overflow:hidden;min-height:76vh}.side{padding:24px 16px;background:linear-gradient(165deg,#fff8e8,#f5e8cf);border-right:1px solid var(--line)}.brand{font:700 23px/1.35 'Mali',sans-serif;margin:0 8px 4px}.brand-sub{font-size:13px;color:var(--muted);margin:0 8px 22px}.nav{display:grid;gap:7px}.nav button{border:0;border-radius:13px;padding:11px 12px;text-align:left;background:transparent;color:var(--ink);font:600 15px 'Mali',sans-serif}.nav button:hover,.nav button.active{background:#f0dfa9}.nav button.active{box-shadow:inset 3px 0 var(--gold)}.main{padding:28px clamp(16px,4vw,42px) 36px;min-width:0}.page-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}.page-head h1{font:700 clamp(25px,4vw,34px)/1.3 'Mali',sans-serif;margin:0}.sub{color:var(--muted);font-size:14px}.btn{border:0;border-radius:999px;padding:10px 18px;min-height:44px;background:#654525;color:white;font:600 15px 'Mali',sans-serif;box-shadow:0 3px 0 #442c18;transition:transform .15s,box-shadow .15s}.btn:hover{transform:translateY(-1px);box-shadow:0 5px 0 #442c18}.btn.light{background:#f5e6bd;color:#503b20;border:1px solid #dfc77f;box-shadow:none}.btn.danger{background:#a34439;box-shadow:0 3px 0 #762f28}.btn.small{padding:5px 12px;min-height:35px;font-size:13px}.btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #bf8a20;outline-offset:2px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:16px}.card{background:#fffefa;border:1px solid var(--line);border-top:5px solid var(--tone,#c9971c);border-radius:8px 18px 18px;padding:17px;box-shadow:0 4px 12px #6149220b;min-width:0}.card h2,.card h3{font:600 18px 'Mali',sans-serif;margin:8px 0}.card h2{font-size:21px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.muted{color:var(--muted);font-size:14px}.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;background:color-mix(in srgb,var(--tone,#c9971c) 16%,white);font-size:13px}.status{border-radius:999px;background:#f3e8cd;padding:2px 9px;font-size:13px}.status.done{background:#dceede;color:#315d3d}.status.progress{background:#ffedc4}.progress{height:8px;background:#f1e7d2;border-radius:99px;overflow:hidden;margin:10px 0}.progress i{display:block;height:100%;background:linear-gradient(90deg,#bd8b28,#edc865);border-radius:99px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 16px}.chip{border:1px solid var(--line);border-radius:99px;background:white;padding:5px 13px;color:var(--ink);font-size:14px}.chip.active{background:#f1dfaa;border-color:#c49a45;font-weight:700}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin:18px 0}.stat{padding:13px;border:1px solid var(--line);border-radius:16px;background:#fffdf7;text-align:center}.stat b{display:block;font:700 30px 'Mali',sans-serif;color:var(--gold)}.empty{padding:25px;text-align:center;border:1px dashed #d9c8a9;border-radius:16px;color:var(--muted);grid-column:1/-1}.wish{padding:14px 18px;border:1px dashed #c99c42;background:#fff5d9;border-radius:16px;margin:15px 0}.item{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px dotted var(--line)}.item input[type=checkbox]{width:21px;height:21px;accent-color:var(--green)}.item .txt{flex:1}.item.checked .txt{text-decoration:line-through;color:var(--muted)}.icon-btn{border:0;background:transparent;color:var(--muted);padding:4px 8px;font-size:16px}.entry{white-space:pre-wrap;margin:8px 0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.form-row{margin:10px 0}.form-row label{display:block;font-weight:600;margin-bottom:4px}.form-row input,.form-row select,.form-row textarea,.settings-input{width:100%;padding:9px 11px;border:1px solid #d9cbb5;border-radius:11px;background:white;color:var(--ink)}.form-row textarea{resize:vertical}.modal{width:min(560px,94vw);max-height:90vh;overflow:auto;border:1px solid #d2ad58;border-radius:20px;padding:22px;background:var(--cream);color:var(--ink);box-shadow:0 20px 60px #32200c55}.modal::backdrop{background:#3e2b1766}.modal h2{font:700 22px 'Mali',sans-serif;margin:0 0 12px}.modal-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}.check-row{display:flex;align-items:center;gap:8px}.check-row input{width:auto}.notice{font-size:13px;color:var(--muted);min-height:22px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:480px}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line)}th{background:#fff4d8;font-family:'Mali',sans-serif}.mood{font-size:27px}.foot{text-align:center;color:#806d55;font-size:13px;padding:15px}.sharelink{display:inline-block;margin-top:10px;color:#73501f}.late{color:var(--red);font-weight:700}
@media(max-width:760px){.wrap{padding:0;margin:0 auto 28px}.shell{display:flex;flex-direction:column;border-radius:0;min-height:90vh}.side{padding:12px 12px 8px;border-right:0;border-bottom:1px solid var(--line)}.brand{font-size:18px;margin:0 4px}.brand-sub{display:none}.nav{display:flex;overflow-x:auto;gap:5px;margin-top:8px}.nav button{white-space:nowrap;padding:9px 12px}.nav button.active{box-shadow:inset 0 -3px var(--gold)}.main{padding:20px 15px 28px}.page-head{align-items:flex-start}.card{padding:14px}.top{font-size:13px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
@media print{body{background:white}.top,.side,.no-print,.foot{display:none!important}.wrap{margin:0;padding:0}.shell{display:block;border:0;box-shadow:none}.main{padding:0}.card{break-inside:avoid}}
</style>
</head>
<body>
<div class="top">🎂 ของขวัญวันเกิดแด่ อ.บอล · <a href="birthday.html">เปิดหน้าอวยพรพิเศษ</a></div>
<div class="wrap"><div class="shell"><aside class="side"><h2 class="brand">📔 สมุดของ อ.บอล</h2><p class="brand-sub">วางแผนอย่างสบายใจ ทีละวัน</p><nav class="nav" id="nav" aria-label="เมนูสมุด"></nav></aside><main class="main" id="app" aria-live="polite"></main></div></div>
<footer class="foot">ข้อมูลบันทึกไว้ในเบราว์เซอร์เครื่องนี้ · ส่งออกไฟล์สำรองได้ที่เมนูตั้งค่า</footer>
<dialog class="modal" id="dialog"><form id="editor" method="dialog"></form></dialog>
<script>
'use strict';
const KEY='jsr_nb_v2';
const MOODS=[['😊','สุขใจ'],['😌','สงบ'],['🤩','ตื่นเต้น'],['😐','เฉย ๆ'],['😴','เหนื่อย'],['😟','กังวล']];
const STATUSES=['วางแผน','กำลังทำ','เสร็จแล้ว'];
const MENU=[['home','🏡','หน้าแรก'],['plans','🗓️','แผนงาน'],['lists','✅','เช็กลิสต์'],['diary','📖','ไดอารี่'],['report','📊','รายงาน'],['settings','⚙️','ตั้งค่า']];
const DEFAULT_CATS=[{id:1,i:'📋',n:'งานประจำ',c:'#e8b84a'},{id:2,i:'📚',n:'วิชาการ',c:'#6fa3e0'},{id:3,i:'✍️',n:'งานเขียน',c:'#c68ce0'},{id:4,i:'🌿',n:'สุขภาพ',c:'#7bc49a'},{id:5,i:'🏡',n:'ครอบครัว',c:'#f08c8c'},{id:6,i:'🌸',n:'งานอดิเรก',c:'#f2a65a'}];
const $=s=>document.querySelector(s), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const dateFmt=x=>{if(!x)return 'ไม่ระบุวันที่';const d=new Date(x+'T00:00:00');return Number.isNaN(+d)?'ไม่ระบุวันที่':d.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'})};
const validColor=x=>/^#[0-9a-f]{6}$/i.test(x||'')?x:'#c9971c';
function initial(){let id=10;return{nextId:id,config:{title:'สมุดบันทึกงาน อ.บอล',wish:'ขอให้อาจารย์มีสุขภาพแข็งแรง ใจสงบ และมีความสุขในทุกวัน',cats:DEFAULT_CATS},plans:[],lists:[],diary:[]}}
function normalize(raw){const base=initial();if(!raw||typeof raw!=='object')return base;const cfg=raw.config||raw.cfg||{};base.config.title=String(cfg.title||base.config.title).slice(0,100);base.config.wish=String(cfg.wish||base.config.wish).slice(0,1000);if(Array.isArray(cfg.cats)&&cfg.cats.length){base.config.cats=cfg.cats.slice(0,30).map((c,i)=>({id:Number(c.id)||i+1,i:String(c.i||'📁').slice(0,4),n:String(c.n||'หมวด').slice(0,50),c:validColor(c.c)}))}
const catId=x=>Number(x)||base.config.cats[0]?.id||1;
base.plans=Array.isArray(raw.plans)?raw.plans.map(p=>({id:Number(p.id)||++base.nextId,t:String(p.t||'').slice(0,200),cat:catId(p.cat),s:String(p.s||''),e:String(p.e||''),st:Math.min(2,Math.max(0,Number(p.st)||0)),pr:Math.min(100,Math.max(0,Number(p.pr)||0)),note:String(p.note||'').slice(0,2000),dn:Number(p.dn)||0})):[];
base.lists=Array.isArray(raw.lists)?raw.lists.map(l=>({id:Number(l.id)||++base.nextId,t:String(l.t||'').slice(0,200),cat:catId(l.cat),it:Array.isArray(l.it)?l.it.map(i=>({x:String(i.x||'').slice(0,300),d:Number(i.d)||0})):[]})):[];
base.diary=Array.isArray(raw.diary||raw.dia)?(raw.diary||raw.dia).map(x=>({id:Number(x.id)||++base.nextId,dt:String(x.dt||today()),m:Math.min(5,Math.max(0,Number(x.m)||0)),cat:catId(x.cat),t:String(x.t||'ไม่มีหัวข้อ').slice(0,200),x:String(x.x||'').slice(0,5000)})):[];
base.nextId=Math.max(Number(raw.nextId||raw.n)||base.nextId,...base.plans.map(x=>x.id),...base.lists.map(x=>x.id),...base.diary.map(x=>x.id),10);return base}
function demoData(){const s=initial(),d=new Date();const shift=n=>{const x=new Date(d);x.setDate(x.getDate()+n);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};s.plans=[{id:1,t:'เตรียมเอกสารประชุมประจำเดือน',cat:1,s:shift(-1),e:shift(4),st:1,pr:40,note:'รวบรวมเอกสารที่เกี่ยวข้อง',dn:0},{id:2,t:'ร่างบทความฉบับใหม่',cat:3,s:shift(-3),e:shift(10),st:0,pr:15,note:'',dn:0}];s.lists=[{id:3,t:'งานวันนี้',cat:1,it:[{x:'ตอบอีเมลสำคัญ',d:0},{x:'ทบทวนตารางงานสัปดาห์นี้',d:0}]}];s.diary=[{id:4,dt:shift(0),m:1,cat:6,t:'เช้าที่สงบ',x:'เริ่มวันด้วยชาอุ่น ๆ และวางแผนงานอย่างสบายใจ'}];s.nextId=10;s.demo=true;return s}
function load(){try{const raw=localStorage.getItem(KEY);if(raw)return normalize(JSON.parse(raw));const old=localStorage.getItem('jsr_nb_v1');if(old){const migrated=normalize(JSON.parse(old));return migrated}}catch(err){}return demoData()}
let state=load(),page='home',filter='all',range=7,notice='';
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));notice='บันทึกเรียบร้อยแล้ว'}catch(err){notice='บันทึกในเครื่องไม่สำเร็จ กรุณาส่งออกไฟล์สำรอง'}render()}
function cat(id){return state.config.cats.find(c=>c.id==id)||{i:'📁',n:'ไม่ระบุ',c:'#cccccc'}}
function catTag(id){const c=cat(id);return `<span class="tag" style="--tone:${validColor(c.c)}">${esc(c.i)} ${esc(c.n)}</span>`}
function catOptions(selected){return state.config.cats.map(c=>`<option value="${c.id}" ${c.id==selected?'selected':''}>${esc(c.i)} ${esc(c.n)}</option>`).join('')}
function empty(text){return `<div class="empty">${esc(text)}</div>`}
function heading(title,button=''){return `<div class="page-head"><div><h1>${title}</h1><div class="sub">${new Date().toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div></div>${button}</div>`}
function addButton(label,action){return `<button class="btn no-print" data-action="${action}">＋ ${label}</button>`}
function home(){const active=state.plans.filter(p=>p.st===1).length,pending=state.lists.reduce((n,l)=>n+l.it.filter(i=>!i.d).length,0),week=state.diary.filter(x=>x.dt>=daysAgo(6)).length,soon=state.plans.filter(p=>p.st<2).sort((a,b)=>(a.e||'').localeCompare(b.e||'')).slice(0,4);return `${heading('สวัสดี อ.บอล 🌼')}<div class="wish">💌 ${esc(state.config.wish)}</div><div class="stats"><div class="stat"><b>${active}</b>แผนที่กำลังทำ</div><div class="stat"><b>${pending}</b>รายการที่ยังไม่ติ๊ก</div><div class="stat"><b>${week}</b>บันทึกใน 7 วันล่าสุด</div></div><div class="toolbar no-print">${addButton('แผนงาน','new-plan')}${addButton('เช็กลิสต์','new-list')}${addButton('เขียนไดอารี่','new-diary')}<a class="btn light" href="birthday.html">🎂 หน้าอวยพร</a></div><h2 style="font:600 20px Mali;margin:18px 0 10px">🗓️ แผนงานที่ใกล้ถึงกำหนด</h2><div class="grid">${soon.length?soon.map(planCard).join(''):empty('ยังไม่มีแผนงานที่กำลังดำเนินการ')}</div>`}
function planCard(p){const status=p.st===2?'done':p.st===1?'progress':'';return `<article class="card" style="--tone:${validColor(cat(p.cat).c)}"><div class="row">${catTag(p.cat)}<span class="status ${status}">${STATUSES[p.st]}</span></div><h3>${esc(p.t)}</h3><div class="muted">${dateFmt(p.s)} → <span class="${p.st<2&&p.e&&p.e<today()?'late':''}">${dateFmt(p.e)}</span></div><div class="progress"><i style="width:${p.pr}%"></i></div><div class="row"><span class="muted">ความคืบหน้า ${p.pr}%</span><button class="btn light small" data-action="edit-plan" data-id="${p.id}">แก้ไข</button></div>${p.note?`<p class="muted">${esc(p.note)}</p>`:''}</article>`}
function filterChips(){return `<div class="chips no-print"><button class="chip ${filter==='all'?'active':''}" data-action="filter" data-id="all">ทั้งหมด</button>${state.config.cats.map(c=>`<button class="chip ${filter==c.id?'active':''}" data-action="filter" data-id="${c.id}">${esc(c.i)} ${esc(c.n)}</button>`).join('')}</div>`}
function plansPage(){const list=state.plans.filter(p=>filter==='all'||p.cat==filter).sort((a,b)=>(a.st===2)-(b.st===2)||(a.e||'').localeCompare(b.e||''));return `${heading('🗓️ แผนงาน',addButton('เพิ่มแผนงาน','new-plan'))}${filterChips()}<div class="grid">${list.length?list.map(planCard).join(''):empty('ยังไม่มีแผนงานในหมวดนี้')}</div>`}
function listsPage(){const list=state.lists.filter(l=>filter==='all'||l.cat==filter);return `${heading('✅ เช็กลิสต์',addButton('เพิ่มเช็กลิสต์','new-list'))}${filterChips()}<div class="grid">${list.length?list.map(l=>{const done=l.it.filter(i=>i.d).length;return `<article class="card" style="--tone:${validColor(cat(l.cat).c)}"><div class="row">${catTag(l.cat)}<span class="muted">${done}/${l.it.length} เสร็จ</span></div><h3>${esc(l.t)}</h3><div class="progress"><i style="width:${l.it.length?done/l.it.length*100:0}%"></i></div>${l.it.map((i,j)=>`<label class="item ${i.d?'checked':''}"><input type="checkbox" data-action="toggle-item" data-list="${l.id}" data-index="${j}" ${i.d?'checked':''}><span class="txt">${esc(i.x)}</span><button class="icon-btn no-print" type="button" data-action="remove-item" data-list="${l.id}" data-index="${j}" aria-label="ลบรายการ">✕</button></label>`).join('')}<form class="add-item no-print" data-list="${l.id}" style="display:flex;gap:7px;margin:12px 0"><input name="item" aria-label="รายการใหม่" placeholder="เพิ่มรายการ…" required maxlength="300" style="min-width:0;flex:1;padding:8px;border:1px solid var(--line);border-radius:10px"><button class="btn small">เพิ่ม</button></form><div class="row no-print"><button class="btn light small" data-action="edit-list" data-id="${l.id}">แก้ไขชื่อ</button><button class="btn light small" data-action="delete-list" data-id="${l.id}">ลบเช็กลิสต์</button></div></article>`}).join(''):empty('ยังไม่มีเช็กลิสต์ในหมวดนี้')}</div>`}
function diaryPage(){const list=state.diary.filter(x=>filter==='all'||x.cat==filter).sort((a,b)=>b.dt.localeCompare(a.dt));return `${heading('📖 ไดอารี่',addButton('เขียนไดอารี่','new-diary'))}${filterChips()}<div class="grid">${list.length?list.map(x=>`<article class="card" style="--tone:${validColor(cat(x.cat).c)}"><div class="row"><span class="muted">${dateFmt(x.dt)}</span><span class="mood" title="${MOODS[x.m][1]}">${MOODS[x.m][0]}</span></div><h3>${esc(x.t)}</h3><p class="entry">${esc(x.x)}</p><div class="row">${catTag(x.cat)}<span class="no-print"><button class="btn light small" data-action="edit-diary" data-id="${x.id}">แก้ไข</button> <button class="btn light small" data-action="delete-diary" data-id="${x.id}">ลบ</button></span></div></article>`).join(''):empty('ยังไม่มีบันทึก เริ่มเขียนเรื่องราวของวันนี้ได้เลย')}</div>`}
function daysAgo(n){const d=new Date();d.setDate(d.getDate()-n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function reportPage(){const from=daysAgo(range-1),diary=state.diary.filter(x=>x.dt>=from),donePlans=state.plans.filter(p=>p.dn&&p.dn>=new Date(from+'T00:00').getTime()),checked=state.lists.flatMap(l=>l.it.map(i=>i.d)).filter(t=>t&&t>=new Date(from+'T00:00').getTime()).length,moodCounts=MOODS.map((m,i)=>[m,diary.filter(x=>x.m===i).length]),days=new Set(diary.map(x=>x.dt)).size;return `${heading('📊 รายงาน')}<div class="row no-print" style="justify-content:flex-end;margin-bottom:14px"><label class="muted">ช่วงเวลา <select id="range" style="width:auto;padding:7px;border:1px solid var(--line);border-radius:9px">${[7,30,90].map(n=>`<option value="${n}" ${n===range?'selected':''}>${n} วัน</option>`).join('')}</select></label><button class="btn light" data-action="csv">ส่งออก CSV</button><button class="btn" data-action="print">พิมพ์ / PDF</button></div><div class="stats"><div class="stat"><b>${days}/${range}</b>วันที่เขียนไดอารี่</div><div class="stat"><b>${checked}</b>รายการที่ติ๊กแล้ว</div><div class="stat"><b>${donePlans.length}</b>แผนงานที่เสร็จ</div></div><article class="card"><h2>อารมณ์ในช่วงนี้</h2>${moodCounts.map(([m,n])=>`<div class="row" style="margin:7px 0"><span>${m[0]} ${m[1]}</span><div class="progress" style="flex:1;margin:0 10px"><i style="width:${diary.length?n/diary.length*100:0}%"></i></div><b>${n}</b></div>`).join('')}</article><article class="card" style="margin-top:16px"><h2>สรุปตามหมวดหมู่</h2><div class="table-wrap"><table><thead><tr><th>หมวด</th><th>ไดอารี่</th><th>แผนที่เสร็จ</th></tr></thead><tbody>${state.config.cats.map(c=>`<tr><td>${esc(c.i)} ${esc(c.n)}</td><td>${diary.filter(x=>x.cat===c.id).length}</td><td>${donePlans.filter(p=>p.cat===c.id).length}</td></tr>`).join('')}</tbody></table></div></article><article class="card" style="margin-top:16px"><h2>บันทึกในช่วงนี้</h2>${diary.length?diary.slice().sort((a,b)=>b.dt.localeCompare(a.dt)).map(x=>`<p><b>${MOODS[x.m][0]} ${dateFmt(x.dt)} · ${esc(x.t)}</b><br><span class="muted">${esc(x.x)}</span></p>`).join(''): '<p class="muted">ยังไม่มีบันทึกในช่วงนี้</p>'}</article>`}
function settingsPage(){return `${heading('⚙️ ตั้งค่า')}<div class="grid"><article class="card"><h2>หน้าตาสมุด</h2><form id="settings-form"><div class="form-row"><label for="book-title">ชื่อสมุด</label><input id="book-title" name="title" maxlength="100" value="${esc(state.config.title)}" required></div><div class="form-row"><label for="book-wish">ข้อความอวยพรหน้าแรก</label><textarea id="book-wish" name="wish" rows="3" maxlength="1000">${esc(state.config.wish)}</textarea></div><button class="btn">บันทึกการตั้งค่า</button></form></article><article class="card"><h2>สำรองและกู้คืน</h2><p class="muted">สำรองเป็นไฟล์ JSON เพื่อย้ายข้อมูลหรือเก็บไว้ในที่ปลอดภัย ข้อมูลจะอยู่ในเบราว์เซอร์นี้ ไม่ได้ซิงก์ข้ามเครื่อง</p><div class="toolbar"><button class="btn light" data-action="export">ดาวน์โหลดข้อมูลสำรอง</button><label class="btn light" for="import-file">เลือกไฟล์กู้คืน</label><input id="import-file" type="file" accept="application/json,.json" hidden><button class="btn danger" data-action="reset">ล้างข้อมูลและเริ่มใหม่</button></div></article><article class="card"><h2>หมวดหมู่</h2><div>${state.config.cats.map((c,i)=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><span>${esc(c.i)} ${esc(c.n)}</span><span><input type="color" aria-label="สี ${esc(c.n)}" data-cat-color="${i}" value="${validColor(c.c)}" style="width:42px;height:34px;padding:2px;border:0;background:transparent"><button class="icon-btn" data-action="delete-cat" data-index="${i}" aria-label="ลบหมวด">ลบ</button></span></div>`).join('')}</div><button class="btn light" style="margin-top:12px" data-action="add-cat">＋ เพิ่มหมวด</button></article></div><p class="notice" role="status">${esc(notice)}</p>`}
function render(){const nav=$('#nav');nav.innerHTML=MENU.map(([key,icon,label])=>`<button class="${page===key?'active':''}" data-page="${key}" ${page===key?'aria-current="page"':''}>${icon} ${label}</button>`).join('');const views={home,plans:plansPage,lists:listsPage,diary:diaryPage,report:reportPage,settings:settingsPage};$('#app').innerHTML=views[page]();document.title=state.config.title||'สมุดบันทึกงาน';}
function openEditor(title,body,saveFn,removeFn){const dialog=$('#dialog'),form=$('#editor');form.innerHTML=`<h2>${title}</h2>${body}<div class="modal-actions"><button class="btn">บันทึก</button>${removeFn?'<button class="btn danger" type="button" data-action="modal-delete">ลบ</button>':''}<button class="btn light" type="button" data-action="modal-close">ยกเลิก</button></div>`;form.onsubmit=ev=>{ev.preventDefault();if(saveFn(new FormData(form))===false)return;dialog.close();persist()};form.querySelector('[data-action="modal-close"]').onclick=()=>dialog.close();const del=form.querySelector('[data-action="modal-delete"]');if(del)del.onclick=()=>{if(confirm('ยืนยันการลบ?')){removeFn();dialog.close();persist()}};dialog.showModal()}
function field(label,name,type,value='',opts=''){return `<div class="form-row"><label for="f-${name}">${label}</label>${type==='select'?`<select id="f-${name}" name="${name}">${opts}</select>`:type==='textarea'?`<textarea id="f-${name}" name="${name}" rows="4">${esc(value)}</textarea>`:`<input id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" ${type==='number'?'min="0" max="100"':''}>`}</div>`}
function editPlan(id){const old=state.plans.find(p=>p.id===Number(id)),p=old||{t:'',cat:state.config.cats[0]?.id||1,s:today(),e:today(),st:0,pr:0,note:''};openEditor(old?'แก้ไขแผนงาน':'เพิ่มแผนงาน',field('ชื่อแผนงาน','t','text',p.t)+field('หมวดหมู่','cat','select',p.cat,catOptions(p.cat))+field('วันเริ่ม','s','date',p.s)+field('วันสิ้นสุด','e','date',p.e)+field('สถานะ','st','select',p.st,STATUSES.map((x,i)=>`<option value="${i}" ${p.st===i?'selected':''}>${x}</option>`).join(''))+field('ความคืบหน้า (%)','pr','number',p.pr)+field('บันทึกเพิ่มเติม','note','textarea',p.note),fd=>{const d=Object.fromEntries(fd);if(!d.t.trim()){alert('กรุณากรอกชื่อแผนงาน');return false}if(d.s&&d.e&&d.e<d.s){alert('วันสิ้นสุดต้องไม่ก่อนวันเริ่ม');return false}const st=Number(d.st),item={id:old?.id||++state.nextId,t:d.t.trim(),cat:Number(d.cat),s:d.s,e:d.e,st,pr:st===2?100:Math.min(100,Number(d.pr)||0),note:d.note,dn:st===2?(old?.dn||Date.now()):0};if(old)Object.assign(old,item);else state.plans.push(item)},old?()=>state.plans=state.plans.filter(x=>x.id!==old.id):null)}
function editList(id){const old=state.lists.find(l=>l.id===Number(id)),l=old||{t:'',cat:state.config.cats[0]?.id||1};openEditor(old?'แก้ไขเช็กลิสต์':'เพิ่มเช็กลิสต์',field('ชื่อเช็กลิสต์','t','text',l.t)+field('หมวดหมู่','cat','select',l.cat,catOptions(l.cat)),fd=>{const d=Object.fromEntries(fd);if(!d.t.trim()){alert('กรุณากรอกชื่อเช็กลิสต์');return false}if(old){old.t=d.t.trim();old.cat=Number(d.cat)}else state.lists.push({id:++state.nextId,t:d.t.trim(),cat:Number(d.cat),it:[]})},old?()=>state.lists=state.lists.filter(x=>x.id!==old.id):null)}
function editDiary(id){const old=state.diary.find(x=>x.id===Number(id)),x=old||{dt:today(),m:0,cat:state.config.cats[0]?.id||1,t:'',x:''};const moodOptions=MOODS.map(([icon,name],i)=>`<option value="${i}" ${x.m===i?'selected':''}>${icon} ${name}</option>`).join('');openEditor(old?'แก้ไขไดอารี่':'เขียนไดอารี่',field('วันที่','dt','date',x.dt)+field('อารมณ์วันนี้','m','select',x.m,moodOptions)+field('หมวดหมู่','cat','select',x.cat,catOptions(x.cat))+field('หัวข้อ','t','text',x.t)+field('บันทึกของวันนี้','x','textarea',x.x),fd=>{const d=Object.fromEntries(fd);if(!d.dt){alert('กรุณาเลือกวันที่');return false}const item={id:old?.id||++state.nextId,dt:d.dt,m:Number(d.m),cat:Number(d.cat),t:d.t.trim()||'ไม่มีหัวข้อ',x:d.x};if(old)Object.assign(old,item);else state.diary.push(item)},old?()=>state.diary=state.diary.filter(y=>y.id!==old.id):null)}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`notebook-backup-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const raw=JSON.parse(reader.result);if(!raw.plans||!raw.lists||!(raw.diary||raw.dia)||!(raw.config||raw.cfg))throw Error();if(!confirm('กู้คืนไฟล์นี้แทนข้อมูลปัจจุบันหรือไม่? แนะนำให้ดาวน์โหลดสำรองข้อมูลปัจจุบันก่อน'))return;state=normalize(raw);persist()}catch(err){alert('ไฟล์สำรองไม่ถูกต้องหรืออ่านไม่ได้')}};reader.readAsText(file)}
function downloadCsv(){const rows=[['วันที่','อารมณ์','หมวดหมู่','หัวข้อ','บันทึก'],...state.diary.map(x=>[x.dt,MOODS[x.m][1],cat(x.cat).n,x.t,x.x])],quote=x=>'"'+String(x??'').replace(/"/g,'""')+'"',blob=new Blob(['\ufeff'+rows.map(r=>r.map(quote).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`diary-${today()}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('#nav').addEventListener('click',ev=>{const b=ev.target.closest('[data-page]');if(!b)return;page=b.dataset.page;filter='all';render()});
$('#app').addEventListener('click',ev=>{const b=ev.target.closest('[data-action]');if(!b)return;const {action,id}=b.dataset;switch(action){case'new-plan':editPlan();break;case'edit-plan':editPlan(id);break;case'new-list':editList();break;case'edit-list':editList(id);break;case'delete-list':if(confirm('ลบเช็กลิสต์นี้และรายการย่อยทั้งหมด?')){state.lists=state.lists.filter(x=>x.id!==Number(id));persist()}break;case'new-diary':editDiary();break;case'edit-diary':editDiary(id);break;case'delete-diary':if(confirm('ลบบันทึกนี้หรือไม่?')){state.diary=state.diary.filter(x=>x.id!==Number(id));persist()}break;case'filter':filter=id==='all'?'all':Number(id);render();break;case'remove-item':{const l=state.lists.find(x=>x.id===Number(b.dataset.list));if(l){l.it.splice(Number(b.dataset.index),1);persist()}break}case'export':exportData();break;case'reset':if(confirm('ลบข้อมูลในสมุดนี้และเริ่มสมุดว่างหรือไม่? แนะนำให้สำรองข้อมูลก่อน')){state=initial();persist()}break;case'add-cat':if(state.config.cats.length>=30){alert('เพิ่มได้สูงสุด 30 หมวด');break}state.config.cats.push({id:++state.nextId,i:'📁',n:'หมวดใหม่',c:'#c9971c'});persist();break;case'delete-cat':if(state.config.cats.length<=1){alert('ต้องมีอย่างน้อย 1 หมวด');break}if(confirm('ลบหมวดนี้หรือไม่? รายการเดิมจะยังอยู่และแสดงเป็นไม่ระบุ')){state.config.cats.splice(Number(b.dataset.index),1);persist()}break;case'csv':downloadCsv();break;case'print':window.print();break;case'modal-close':$('#dialog').close();break}});
$('#app').addEventListener('change',ev=>{const t=ev.target;if(t.matches('[data-action="toggle-item"]')){const l=state.lists.find(x=>x.id===Number(t.dataset.list)),i=l?.it[Number(t.dataset.index)];if(i){i.d=t.checked?Date.now():0;persist()}}if(t.id==='range'){range=Number(t.value);render()}if(t.id==='import-file'){importData(t.files[0]);t.value=''}if(t.matches('[data-cat-color]')){state.config.cats[Number(t.dataset.catColor)].c=validColor(t.value);persist()}});
$('#app').addEventListener('submit',ev=>{if(ev.target.matches('.add-item')){ev.preventDefault();const l=state.lists.find(x=>x.id===Number(ev.target.dataset.list)),input=ev.target.elements.item;if(l&&input.value.trim()){l.it.push({x:input.value.trim(),d:0});persist()}}if(ev.target.id==='settings-form'){ev.preventDefault();const fd=new FormData(ev.target);state.config.title=String(fd.get('title')||'').trim()||'สมุดบันทึกงาน';state.config.wish=String(fd.get('wish')||'').trim();persist()}});
$('#dialog').addEventListener('click',ev=>{if(ev.target===ev.currentTarget)ev.currentTarget.close()});
render();
</script>
</body>
</html>
